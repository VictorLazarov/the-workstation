name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
  feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck
      - run: shellcheck -S warning devcontainer/src/workstation/install.sh scripts/*.sh
      - run: scripts/test-feature.sh
  feature-container:
    # Builds a real container with the feature (source=local) via the devcontainer CLI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @devcontainers/cli
      - run: devcontainer features test -f workstation --skip-autogenerated --project-folder devcontainer
