name: CI
# Trigger by hand: Actions tab -> CI -> "Run workflow" (workflow_dispatch), or `gh workflow run CI --ref <branch>`.
# Action versions use major tags (first-party actions only); .github/dependabot.yml proposes updates. Pin to commit SHAs
# when hardening for release (tags can move): `gh api repos/actions/checkout/git/ref/tags/v4 --jq .object.sha`.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: true
  FORCE_COLOR: '0'
jobs:
  # Job names (as shown in the checks list): "node (ubuntu-latest, node 20)" ... "node (windows-latest, node 22)"
  node:
    name: node (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash # Windows: PowerShell would only report the LAST command's exit code
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - name: Keep LF line endings on Windows checkouts
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Unit tests (protocol, web incl. browser-compat gate, server incl. terminal)
        if: runner.os != 'Windows'
        run: npm test
      - name: "Unit tests (Windows - protocol, web, server without PTY/real-CLI suites)"
        if: runner.os == 'Windows'
        run: |
          npm test -w @workstation/protocol -w @workstation/web --if-present
          npm test -w @workstation/server -- --exclude test/terminal.test.ts --exclude test/cli-isolation.test.ts
      - name: Windows PTY (ConPTY) + real-CLI isolation suites (ADVISORY until proven green on a Windows runner)
        # Tracking: remove continue-on-error once this step has been green; the logic these suites guard is unit-tested
        # in server/test/platform.test.ts with injected win32 values and runs in the required step above.
        if: runner.os == 'Windows'
        continue-on-error: true
        run: npm test -w @workstation/server -- test/terminal.test.ts test/cli-isolation.test.ts
      - name: Built CLI boots (mock mode) and serves the SPA
        run: node packages/server/scripts/smoke-cli.mjs

  e2e:
    # Full Playwright suite (mock SDK) in all three engines on Linux. Firefox/WebKit are ADVISORY (continue-on-error)
    # until they have been green once; flip `continue-on-error` below when they are.
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: ${{ matrix.browser != 'chromium' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Install browser (CI only)
        run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: packages/e2e
      - name: Playwright
        run: npx playwright test
        working-directory: packages/e2e
        env:
          E2E_BROWSERS: ${{ matrix.browser }}
          E2E_REPORT_DIR: ${{ github.workspace }}/e2e-report
          E2E_RESULTS_DIR: ${{ github.workspace }}/e2e-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-${{ matrix.browser }}-linux
          path: |
            e2e-report
            e2e-results
          retention-days: 7
          if-no-files-found: ignore

  e2e-smoke:
    # Smaller smoke on the other desktop OSes: the real UI flows (token, sessions, composer, permissions), not the layout sweep.
    # ADVISORY for now (never run on these runners before); see docs/CROSS_PLATFORM.md.
    name: e2e-smoke (${{ matrix.os }}, ${{ matrix.browser }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, browser: webkit, project: app-webkit }
          - { os: windows-latest, browser: chromium, project: app }
    steps:
      - name: Keep LF line endings on Windows checkouts
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Install browser (CI only)
        run: npx playwright install ${{ matrix.browser }}
        working-directory: packages/e2e
      - name: Playwright smoke
        run: npx playwright test --project=${{ matrix.project }} "tests/app/(token|sessions|composer|permissions)"
        working-directory: packages/e2e
        env:
          E2E_BROWSERS: ${{ matrix.browser }}
          E2E_REPORT_DIR: ${{ github.workspace }}/e2e-report
          E2E_RESULTS_DIR: ${{ github.workspace }}/e2e-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-smoke-${{ matrix.browser }}-${{ runner.os }}
          path: |
            e2e-report
            e2e-results
          retention-days: 7
          if-no-files-found: ignore

  feature:
    # Lint + offline smoke of the installer (stub repo, no Docker).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck
      - run: shellcheck -S warning devcontainer/src/workstation/install.sh scripts/*.sh devcontainer/test/workstation/*.sh
      - run: scripts/test-feature.sh
  devcontainer:
    # REAL containers: the Dev Container Feature on several base images, devcontainer up with a published port, the root
    # Dockerfile and docker-compose.yml. scripts/test-devcontainer.sh builds a snapshot of the checked-out tree, serves
    # it from a local git daemon (the release tag does not need to exist) and drives @devcontainers/cli. See
    # docs/DEVCONTAINER.md ("Testing"). Alpine (musl) runs here but could not be run in the authoring sandbox.
    name: devcontainer (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu + node image, args: "--stage features git-ubuntu git-node" }
          - { name: debian + alpine,     args: "--stage features git-debian git-alpine" }
          - { name: tarball + local,     args: "--stage features tarball local-mount" }
          - { name: options,             args: "--stage features bind-all-interfaces autostart-off claude-code-cli" }
          - { name: up + published port, args: "--stage up" }
          - { name: Dockerfile + compose, args: "--stage image" }
          - { name: scripts/install.sh,   args: "--stage installer" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run
        run: scripts/test-devcontainer.sh ${{ matrix.args }}
        env:
          WS_TEST_KEEP: '1'
          WS_TEST_WORKDIR: ${{ runner.temp }}/wstest
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: devcontainer-logs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/wstest/*.log
          retention-days: 7
          if-no-files-found: ignore
